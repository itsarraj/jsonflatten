[package]
name = "jsonflatten"
version = "0.1.0"
edition = "2021"
description = "Flattens deeply nested JSON into flat dot-path key/value rows and unflattens back to the original structure"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/jsonflatten"
readme = "README.md"
keywords = ["json", "flatten", "cli", "dot-path"]
categories = ["command-line-utilities"]

[lib]
name = "jsonflatten"
path = "src/lib.rs"

[[bin]]
name = "jsonflatten"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_json = "1"
